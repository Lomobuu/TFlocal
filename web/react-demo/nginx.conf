server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames under /assets, so they can be cached
  # indefinitely — a new build produces new names.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback. Without this, any path other than / returns 404 as soon as
  # the app gains client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
